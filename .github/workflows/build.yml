name: 打包 EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests

    - name: 打包 EXE
      run: |
        pyinstaller --onefile --name="Minecraft_Server_Launcher" main.py

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft_Server_Launcher
        path: dist/Minecraft_Server_Launcher.exe
